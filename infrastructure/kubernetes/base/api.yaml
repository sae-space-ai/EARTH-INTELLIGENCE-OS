apiVersion: apps/v1
kind: Deployment
metadata:
  name: earth-intelligence-api
  labels:
    app: earth-intelligence-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: earth-intelligence-api
  template:
    metadata:
      labels:
        app: earth-intelligence-api
    spec:
      serviceAccountName: earth-intelligence-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: earth-intelligence-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: earth-intelligence-config
                  key: environment
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: earth-intelligence-secrets
                  key: database-url
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: earth-intelligence-api
spec:
  selector:
    app: earth-intelligence-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: earth-intelligence-api
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: earth-intelligence-config
data:
  environment: production
  log-level: INFO
