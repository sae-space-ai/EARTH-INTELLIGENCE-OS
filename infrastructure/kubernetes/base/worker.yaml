apiVersion: apps/v1
kind: Deployment
metadata:
  name: earth-intelligence-worker
  labels:
    app: earth-intelligence-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: earth-intelligence-worker
  template:
    metadata:
      labels:
        app: earth-intelligence-worker
    spec:
      serviceAccountName: earth-intelligence-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: worker
          image: earth-intelligence-worker:latest
          env:
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: earth-intelligence-config
                  key: environment
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: earth-intelligence-secrets
                  key: database-url
            - name: EVENT_BUS_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: earth-intelligence-config
                  key: event-bus-brokers
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["python", "-c", "print('ok')"]
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: earth-intelligence-worker
